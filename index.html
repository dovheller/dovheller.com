    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => t.classList.add('hidden'), 2800);
    }

    function copyText(val, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).then(() => showToast(label)).catch(() => fallbackCopy(val, label));
      } else {
        fallbackCopy(val, label);
      }
    }

    function fallbackCopy(val, label) {
      const ta = document.createElement('textarea');
      ta.value = val;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(label); } catch (e) {}
      document.body.removeChild(ta);
    }

    function bindViewEvents(d) {
      // Pillars on home
      document.querySelectorAll('[data-pillar]').forEach(btn => {
        btn.addEventListener('click', () => {
          STATE.activePillar = btn.dataset.pillar;
          render();
        });
      });
      document.querySelectorAll('[data-go-pillar]').forEach(btn => {
        btn.addEventListener('click', () => {
          const r = btn.dataset.goPillar;
          const c = btn.dataset.pillarCap;
          if (r === 'capabilities') STATE.capTab = c === 'support' ? 'support' : 'software';
          navigate(r);
        });
      });
      document.querySelectorAll('[data-go]').forEach(btn => {
        btn.addEventListener('click', () => navigate(btn.dataset.go));
      });

      // Capability tabs
      document.querySelectorAll('[data-cap-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          STATE.capTab = btn.dataset.capTab;
          render();
        });
      });

      // Cyber language toggle
      const cyberToggle = document.getElementById('cyber-lang-toggle');
      if (cyberToggle) {
        cyberToggle.addEventListener('click', () => {
          STATE.cyberLang = STATE.cyberLang === 'en' ? 'he' : 'en';
          render();
        });
      }

      // Proofs filters & expand
      document.querySelectorAll('[data-proof-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          STATE.proofFilter = btn.dataset.proofFilter;
          render();
        });
      });
      document.querySelectorAll('[data-toggle-proof]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.toggleProof;
          STATE.expandedProof = STATE.expandedProof === id ? null : id;
          render();
        });
      });

      // Copy buttons
      document.querySelectorAll('[data-copy]').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.copy;
          copyText(val, STATE.lang === 'he' ? 'הועתק: ' + val : 'Copied: ' + val);
        });
      });

      // Contact form validation (blur per field, full on submit)
      const form = document.getElementById('contact-form');
      if (form) {
        const fields = [
          { el: document.getElementById('f-name'), err: document.getElementById('err-name') },
          { el: document.getElementById('f-reply'), err: document.getElementById('err-reply') },
          { el: document.getElementById('f-msg'), err: document.getElementById('err-msg') }
        ];
        const validateField = (f) => {
          const ok = f.el.value.trim().length > 0;
          f.err.classList.toggle('hidden', ok);
          return ok;
        };
        fields.forEach(f => {
          f.el.addEventListener('blur', () => validateField(f));
        });
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const allOk = fields.map(validateField).every(Boolean);
          if (!allOk) return;
          const name = fields[0].el.value.trim();
          const reply = fields[1].el.value.trim();
          const msg = fields[2].el.value.trim();
          const subject = encodeURIComponent('dovheller.com — ' + name);
          const body = encodeURIComponent('From: ' + name + '\nReply to: ' + reply + '\n\n' + msg);
          document.getElementById('dispatch-mail').href = 'mailto:dovheller@gmail.com?subject=' + subject + '&body=' + body;
          document.getElementById('dispatch-wa').href = 'https://wa.me/972525610123?text=' + body;
          document.getElementById('dispatch-box').classList.remove('hidden');
        });
      }
    }

    function navigate(route) {
      STATE.route = route;
      document.getElementById('mobile-nav').classList.add('hidden');
      document.getElementById('mobile-menu-btn').setAttribute('aria-expanded', 'false');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function render() {
      const d = DATA[STATE.lang];
      const htmlEl = document.documentElement;
      htmlEl.lang = STATE.lang;
      htmlEl.dir = STATE.lang === 'he' ? 'rtl' : 'ltr';

      // Cyber mode theme
      document.body.classList.toggle('cyber-mode', STATE.route === 'cyber');

      // Update nav labels & active state
      document.querySelectorAll('[data-route]').forEach(btn => {
        const r = btn.dataset.route;
        if (r === 'cyber') {
          const span = btn.querySelectorAll('span')[1];
          if (span) span.textContent = d.nav.cyber;
        } else {
          btn.textContent = d.nav[r];
        }
        btn.classList.toggle('active', r === STATE.route);
      });

      document.getElementById('lang-toggle').textContent = d.nav.langBtn;
      document.getElementById('footer-copy').textContent = d.nav.footer;
      document.getElementById('link-privacy').textContent = d.nav.privacy;
      document.getElementById('link-accessibility').textContent = d.nav.accessibility;
      document.getElementById('link-terms').textContent = d.nav.terms;
      document.getElementById('consent-text').textContent = d.nav.consentText;
      document.getElementById('consent-accept').textContent = d.nav.accept;
      document.getElementById('consent-decline').textContent = d.nav.decline;

      const main = document.getElementById('main-content');
      if (STATE.route === 'home') main.innerHTML = renderHome(d);
      else if (STATE.route === 'about') main.innerHTML = renderAbout(d);
      else if (STATE.route === 'capabilities') main.innerHTML = renderCapabilities(d);
      else if (STATE.route === 'cyber') main.innerHTML = renderCyber();
      else if (STATE.route === 'proofs') main.innerHTML = renderProofs(d);
      else if (STATE.route === 'approach') main.innerHTML = renderApproach(d);
      else if (STATE.route === 'contact') main.innerHTML = renderContact(d);

      bindViewEvents(d);
    }

    // Global nav & chrome listeners
    document.getElementById('brand-home-btn').addEventListener('click', () => navigate('home'));
    document.querySelectorAll('[data-route]').forEach(btn => {
      btn.addEventListener('click', () => navigate(btn.dataset.route));
    });
    document.getElementById('lang-toggle').addEventListener('click', () => {
      STATE.lang = STATE.lang === 'he' ? 'en' : 'he';
      render();
    });
    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
      const m = document.getElementById('mobile-nav');
      const open = m.classList.toggle('hidden');
      document.getElementById('mobile-menu-btn').setAttribute('aria-expanded', String(!open));
    });

    // Legal modal
    const modal = document.getElementById('legal-modal');
    document.querySelectorAll('[data-legal]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.legal;
        const info = LEGAL[STATE.lang][key];
        document.getElementById('legal-modal-title').textContent = info.title;
        document.getElementById('legal-modal-body').innerHTML = info.body;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });
    });
    document.getElementById('legal-modal-close').addEventListener('click', () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    });

    // Consent banner
    try {
      if (!localStorage.getItem('hd_consent')) {
        document.getElementById('consent-banner').classList.remove('hidden');
      }
    } catch (e) {
      document.getElementById('consent-banner').classList.remove('hidden');
    }
    ['consent-accept', 'consent-decline'].forEach(id => {
      document.getElementById(id).addEventListener('click', () => {
        try { localStorage.setItem('hd_consent', id === 'consent-accept' ? 'accepted' : 'declined'); } catch (e) {}
        document.getElementById('consent-banner').classList.add('hidden');
      });
    });

    render();
  </script>
</body>
</html>
